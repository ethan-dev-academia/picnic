<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Park map &mdash; Golden Gate Park</title>

  <!-- Type: Fraunces for display, Inter for UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap">

  <!-- Leaflet 1.9.4 (unpkg CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <link rel="stylesheet" href="assets/map.css">
</head>
<body>
  <header class="map-header">
    <div class="header-title">
      <h1>Park map</h1>
      <p class="header-sub">Golden Gate Park</p>
    </div>
    <a class="back-link" href="index.html">&larr; Guest lookup</a>
    <button id="sidebar-toggle" class="sidebar-toggle" type="button"
            aria-expanded="true" aria-controls="sidebar">
      Index
    </button>
  </header>

  <div id="notice" class="notice" hidden></div>

  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="Picnic locations">
      <h2 class="sidebar-title">Location index</h2>
      <ul id="location-list" class="location-list">
        <li class="location-empty">Loading locations&hellip;</li>
      </ul>
    </aside>
    <main id="map" class="map" role="application" aria-label="Map of picnic locations"></main>
  </div>

  <!-- Data (plain globals; page degrades gracefully if any are missing) -->
  <script src="data/locations.data.js"></script>
  <script src="data/groups.data.js"></script>
  <script src="data/assignments.data.js"></script>

  <script src="assets/map.js"></script>
</body>
</html>
